_config_version: 30
name: tito
agent:
  api_max_retries: 3
  disabled_toolsets: []
  environment_hint: 'Hora local: Chile continental (UTC-4 en invierno, UTC-3 en verano).
    Fecha y hora actual proporcionadas por el sistema.'
  environment_probe: true
  gateway_notify_interval: 180
  max_turns: 90
  reasoning_effort: medium
  tool_use_enforcement: auto
auxiliary:
  approval:
    provider: opencode-go
    model: deepseek-v4-flash
    base_url: https://opencode.ai/zen/go/v1
  background_review:
    provider: opencode-go
    model: deepseek-v4-flash
    base_url: https://opencode.ai/zen/go/v1
  compression:
    provider: opencode-go
    model: deepseek-v4-flash
    base_url: https://opencode.ai/zen/go/v1
  curator:
    provider: opencode-go
    model: deepseek-v4-flash
    base_url: https://opencode.ai/zen/go/v1
  kanban_decomposer:
    provider: opencode-go
    model: deepseek-v4-flash
    base_url: https://opencode.ai/zen/go/v1
  mcp:
    provider: opencode-go
    model: deepseek-v4-flash
    base_url: https://opencode.ai/zen/go/v1
  monitor:
    provider: opencode-go
    model: deepseek-v4-flash
    base_url: https://opencode.ai/zen/go/v1
  profile_describer:
    provider: opencode-go
    model: deepseek-v4-flash
    base_url: https://opencode.ai/zen/go/v1
  skills_hub:
    provider: opencode-go
    model: deepseek-v4-flash
    base_url: https://opencode.ai/zen/go/v1
  title_generation:
    provider: opencode-go
    model: deepseek-v4-flash
    base_url: https://opencode.ai/zen/go/v1
  triage_specifier:
    provider: opencode-go
    model: deepseek-v4-flash
    base_url: https://opencode.ai/zen/go/v1
  tts_audio_tags:
    provider: opencode-go
    model: deepseek-v4-flash
    base_url: https://opencode.ai/zen/go/v1
  vision:
    provider: opencode-go
    model: mimo-v2-omni
    base_url: https://opencode.ai/zen/go/v1
  web_extract:
    provider: opencode-go
    model: deepseek-v4-flash
    base_url: https://opencode.ai/zen/go/v1
approvals:
  cron_mode: approve
  mode: false
  timeout: 60
cron:
  wrap_response: true
display:
  personality: ''
  streaming: false
  platforms:
    whatsapp:
      tool_progress: false
file_read_max_chars: 100000
home: /home/opc/workspace/tenants/tito
memory:
  provider: holographic
model:
  default: deepseek-v4-flash
  provider: opencode-go
fallback_providers:
- provider: opencode-go
  model: qwen3.7-plus
- provider: opencode-go
  model: minimax-m3
tts:
  edge:
    voice: es-CL-LorenzoNeural
  enabled: true
  provider: edge
stt:
  enabled: true
  groq:
    model: whisper-large-v3-turbo
  provider: groq
security:
  allow_lazy_installs: true
  allow_private_urls: false
  redact_secrets: true
terminal:
  backend: local
  cwd: /home/opc/workspace/tenants/tito/repos
  timeout: 180
  auto_source_bashrc: true
toolsets:
- terminal
- file
- web
- cronjob
- skills
whatsapp:
  allowed_users:
  - 56991003292
  - 56994172921
  enabled: true
  mode: bot
  sandbox_for_code: false
  extra:
    bridge_port: 3001
onboarding:
  seen:
    profile_build_offered: true
credential_pool_strategies:
  opencode-go: fill_first
providers:
  opencode-go:
    stale_timeout_seconds: 90
