# Puesto 2026-08-18: tailscaled llegó a 2.2 GB en 54 dias sin reiniciarse, en una
# maquina de 10.9 GB que ya estaba swapeando. Sin techo, nada lo frenaba.
# Restart=always (y no on-failure) para que un corte por memoria se reponga solo:
# tailscaled es la UNICA puerta a esta maquina, el SSH publico esta cerrado.
[Service]
MemoryHigh=512M
MemoryMax=1G
Restart=always
RestartSec=2
