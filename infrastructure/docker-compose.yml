# Toolset Personal — Canonical Docker Compose
# Managed by CI/CD pipeline. Do not edit manually on the server.
# Variables in ${VAR} form are resolved from /opt/toolset/.env

services:
  postgres:
    image: postgres:16-alpine
    container_name: infisical-pg
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INFISICAL_DB_USER:-infisical}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      POSTGRES_USER: ${INFISICAL_DB_USER:-infisical}
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD}
      POSTGRES_DB: ${INFISICAL_DB_NAME:-infisical}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - toolset-net

  redis:
    image: redis:7-alpine
    container_name: infisical-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - toolset-net

  infisical:
    image: infisical/infisical:latest
    container_name: infisical
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - /opt/toolset/.env
    environment:
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET}
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY}
      SITE_URL: ${INFISICAL_SITE_URL:-http://toolset-oci:8081}
      DB_CONNECTION_URI: ${DB_CONNECTION_URI}
      REDIS_URL: redis://redis:6379
    volumes:
      - infisical_data:/data
    networks:
      - toolset-net

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    # PRIORIDAD DE CPU POR ENCIMA DEL RESTO DE LA MAQUINA, no solo de kb-mcp. Caddy es la
    # puerta del fundador (UD-004/D5 de kb-okos) y de todo lo demas que este VPS expone --
    # nunca puede ser el que se queda sin turno de CPU. `--cpus`/`--cpuset-cpus` en
    # desplegar-sin-caida.sh ya topan al contenedor NUEVO de kb-mcp mientras arma su indice
    # (hasta 225s, 100% CPU sin ese tope), pero un tope ahi solo protege de KB-MCP: este VPS
    # corre ademas Hermes, Infisical, y proyectos enteros ajenos (devalis, traza-ambiental)
    # en los mismos 2 nucleos, y CUALQUIERA de ellos puede competir por el mismo turno que
    # Caddy. `cpu_shares` (1024 es el valor por omision de todo contenedor sin esto) es una
    # PRIORIDAD relativa, no un tope: sin contencion no cambia nada -- Caddy sigue usando lo
    # que necesite -- pero bajo contencion real el kernel le da a Caddy ~4x el turno de
    # cualquier otro contenedor sin este ajuste. Medido el 2026-09-26/27: incluso con el
    # contenedor nuevo de kb-mcp topado a 1 nucleo fijo, sondeando la puerta del fundador
    # cada 1s durante una recarga de contenido siguio apareciendo 1 falla ("remote end
    # closed connection"/IncompleteRead) por recarga -- nunca en el instante del recambio de
    # alias, siempre durante la espera de hasta 225s. No se pudo aislar una causa mas
    # especifica (se descarto reinicio de Caddy, ruido de fondo de la maquina en reposo,
    # agotamiento de conntrack, y no aparecio nada en dmesg/journalctl de docker en la
    # ventana exacta): queda como mitigacion adicional, no como arreglo probado en cero.
    #
    # LA CAUSA MAS ESPECIFICA SE ENCONTRO DESPUES, EL 2026-09-27: `docker inspect` mostro que
    # el kb-mcp que YA ESTABA SIRVIENDO tenia cpuset=1 -- el MISMO nucleo que
    # desplegar-sin-caida.sh le asigna a cada candidato nuevo mientras arma su indice al 94-100%
    # de CPU. Como el contenedor activo conserva el cpuset con que nacio, cada candidato termina
    # compitiendo por UN SOLO nucleo contra el propio proceso que responde al fundador -- eso
    # explicaba las fallas residuales mejor que cualquier ruido de la maquina. `cpuset_cpus` fija
    # a Caddy al nucleo "0" (KB_MCP_SERVE_CPU en desplegar-sin-caida.sh, mismo valor) para que
    # SIEMPRE responda desde el nucleo reservado a "lo que sirve" -- ese script repinea ahi
    # mismo al candidato de kb-mcp justo antes de darle el alias, para que tambien el kb-mcp
    # activo viva siempre en este nucleo y nunca en el que usa el proximo candidato en armar su
    # indice. `cpu_shares` se conserva como segunda capa (ayuda si algun dia esto corre en una
    # maquina de un solo nucleo, donde no hay nada que pinear).
    cpu_shares: 4096
    cpuset: "${KB_MCP_SERVE_CPU:-0}"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      infisical:
        condition: service_started
    environment:
      FUNNEL_DOMAIN: ${FUNNEL_DOMAIN:-toolset-oci-1-1.tail2d4c18.ts.net}
      FUNNEL_AUTH_USER: ${FUNNEL_AUTH_USER:-toolset-admin}
      FUNNEL_AUTH_PASSWORD: ${FUNNEL_AUTH_PASSWORD:-changeme}
      # Secretos de las direcciones-capacidad de la KB okos. Valores en el .env del
      # servidor, jamas en git. Sin valor, la ruta falla CERRADA (ver Caddyfile).
      KB_TOKEN_COMPLETO: ${KB_TOKEN_COMPLETO:-}
      KB_TOKEN_PUBLICADO: ${KB_TOKEN_PUBLICADO:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/toolset/landing:/usr/share/caddy/landing
      # Certificado de Tailscale para el puerto 8091 (ver Caddyfile). Lo escribe
      # vps-guardias/renovar-cert-funnel.sh; Caddy solo lo lee.
      - /opt/toolset/certs:/etc/caddy/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - toolset-net

  searxng:
    image: searxng/searxng:latest
    container_name: researchit-searxng
    restart: unless-stopped
    ports:
      - "4000:8080"
    user: root
    environment:
      - SEARXNG_BASE_URL=http://localhost:4000/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - /opt/researchit/searxng:/etc/searxng:rw
    networks:
      - toolset-net

  # kb-mcp — servidor MCP de solo lectura sobre las KBs de kb-template.
  # Aislado a proposito: sin depends_on, sin puertos publicados al host, sin
  # acceso de escritura al repo de la KB. Caddy lo alcanza por la red interna.
  kb-mcp:
    image: kb-mcp:1
    build:
      context: ./kb-mcp
    # Se construye en el VPS; no vive en ningun registry. Sin esto, el paso
    # "docker compose pull" del pipeline intenta pullearla, falla con exit 1 y
    # —por set -euo pipefail— aborta el deploy COMPLETO de Hermes. pull_policy:build
    # le dice a compose que esta imagen se construye y no se debe pullear.
    pull_policy: build
    container_name: kb-mcp
    restart: unless-stopped
    # ~855 MB en regimen. La tabla int8 (256 dims) son 128 MB; el grueso es el
    # tokenizador multilingue (500.353 tokens). Si hiciera falta recuperar RAM,
    # quitar model2vec del Dockerfile deja el servidor en ~60 MB con solo la capa lexica.
    # El limite era 1200m y dejaba 346 MB de margen: una sola llamada a consultar()
    # lo superaba y el kernel mataba el contenedor con SIGKILL (exit 137), asi que
    # tools/list respondia y tools/call daba 502. Verificado 2026-07-24. El VPS tiene
    # 10,9 GB con ~4,2 GB disponibles, asi que 2 GB deja margen de sobra sin apretar
    # a Hermes, que es lo que no se toca.
    mem_limit: 2000m
    read_only: true
    # ESPACIO ESCRIBIBLE SIN RENUNCIAR A `read_only`. Se agrego el 2026-08-07 apuntandole a la carga
    # del codificador; la causa real de esa caida resulto ser otra —las versiones clavadas, ver el
    # Dockerfile— y esto se conserva igual: cuesta memoria despreciable y le quita al contenedor una
    # clase entera de fallas silenciosas por no poder escribir un temporal.
    tmpfs:
      - /tmp:size=64m
      - /home/kb/.cache:size=64m
    security_opt:
      - no-new-privileges:true
    environment:
      # Directorio con TODAS las KB (cada subdir con knowledge-base/ es una).
      KB_ROOT: /kb
      # LA ZONA DE QUIEN LEE, no la del proceso. El contenedor corre en UTC; la base la consulta
      # gente en Chile. Sin esto el servidor sirve 22:33 donde son las 18:33, y «hoy» empieza y
      # termina en el dia equivocado — con la hora por sub-entrada eso deja de ser una molestia y
      # pasa a ser una respuesta falsa: preguntar por «la tarde» a las 18:33 devolveria la noche.
      TZ: ${KB_TZ:-America/Santiago}
      # QUE MODELO USA LA CAPA SEMANTICA. Por omision el estatico montado en /modelo, que es
      # exactamente el comportamiento de siempre: sin esta variable en el .env, nada cambia.
      # Para pasar al codificador se agrega UNA linea a /opt/toolset/.env:
      #   KB_MODELO_KB=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      # y para volver atras se quita esa linea y se levanta el servicio de nuevo. La imagen
      # trae las dos familias instaladas a proposito, asi que revertir NO exige reconstruir.
      # Medido sobre las 81 preguntas juzgadas, con el criterio que importa —quien consulta es
      # siempre un agente, asi que pesa el conjunto y no el primer puesto—: las preguntas que
      # no traen su documento bajan de 27 a 20.
      KB_MODELO: ${KB_MODELO_KB:-/modelo}
      # Cuanto se deja viva la generacion anterior del indice despues de una recarga en
      # caliente, para que las peticiones en vuelo terminen contra el indice con el que
      # empezaron. Ver la clase `Planta` en server.py.
      KB_GRACIA: "30"
      # LA FECHA POR SUB-ENTRADA, apagada por omision. Deriva del historial cuando creció cada
      # nota —no la del archivo, que es la misma para las 70 notas de una entrada grande— y es lo
      # que permite preguntar «que se hizo hoy en la tarde». Corre en el camino del ARRANQUE, asi
      # que se enciende a proposito y con su costo medido en ESTE servidor: `KB_FECHA_SUBENTRADA=1`
      # en /opt/toolset/.env. Sin la variable, todo se comporta como antes.
      #
      # Y NO ALCANZA CON PONERLA EN EL .env: el .env sirve para sustituir ${} en este archivo, no
      # se le pasa solo al contenedor. Se agrego el 2026-08-08 despues de encenderla ahi y
      # comprobar que adentro no existia — el servicio arrancaba sin ella y sin decir nada.
      KB_FECHA_SUBENTRADA: ${KB_FECHA_SUBENTRADA:-0}
      # Host interno + dominio publico del Funnel. La proteccion anti-DNS-rebinding
      # del SDK sigue activa; solo se declaran los Host legitimos.
      KB_ALLOWED_HOSTS: "kb-mcp:8765,localhost:8765,127.0.0.1:8765,${FUNNEL_DOMAIN:-toolset-oci-1-1.tail2d4c18.ts.net}"
    volumes:
      # Se monta el directorio raiz de KB, no una sola: el servidor sirve todas.
      - /opt/kb:/kb:ro
      # Modelo estatico validado (int8, 256 dims, ~140 MB). Es el que se usa: el codificador se
      # probo el 2026-08-07 y se retiro el mismo dia (ver Dockerfile).
      - /opt/kb-modelo-256:/modelo:ro
      # UNICO MONTAJE DE ESCRITURA. Hoy no lo usa nadie —el modelo estatico vectoriza por tabla y no
      # cuesta nada— y se conserva porque es lo que vuelve desplegable a un codificador: el indice se
      # reconstruye al arrancar y `sync-kb.sh` reinicia este contenedor en cada cambio de contenido
      # —28 veces el 2026-08-07—, asi que sin cache el arranque costaria 49 s cada vez. Con el, 8,7 s,
      # y el indice sin ningun modelo ya cuesta 7,9: el codificador agrega 0,8 s. Guarda solo vectores
      # (1 MB), indexados por hash del texto; borrarlo no pierde nada, se recalcula. Ver HEU-013.
      - /opt/kb-vectores:/vectores
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.create_connection(('127.0.0.1',8765),3); s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - toolset-net

networks:
  toolset-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  infisical_data:
